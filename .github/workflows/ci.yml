name: CI

on:
  push:
    branches: [main, develop]
  # Pull requests only run the full matrix when opted in with the
  # run-integration label, which requires write access to apply.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Gate the job rather than the trigger: a skipped job still reports a
    # conclusion, so the check never stays pending on unlabeled pull requests.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Type check tests
        run: npm run typecheck:tests

      # The integration tests load dist/snapshot.injected.global.js, which only
      # the public build writes; build:moz writes dist.moz/. Run both, and upload
      # the all-tools bundle below.
      - name: Build
        run: npm run build:all

      # A dist.moz/ folder on its own cannot be installed: the entry point
      # imports selenium-webdriver and yargs, so it needs package.json beside it.
      # Assemble the same layout the Release archive ships.
      - name: Assemble downloadable package
        if: >-
          github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest' &&
          matrix.node-version == 20
        run: node scripts/prepare-artifact.mjs

      - name: Install Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@latest
        with:
          firefox-version: latest

      # Without an explicit binary, Selenium Manager can pick the Firefox
      # preinstalled on the runner image instead of this one.
      - name: Test with coverage
        run: npm run test:coverage
        env:
          FIREFOX_PATH: ${{ steps.setup-firefox.outputs.firefox-path }}

      - name: Upload coverage reports to Codecov
        if: >-
          github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest' &&
          matrix.node-version == 20
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload artifacts
        if: >-
          github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest' &&
          matrix.node-version == 20
        uses: actions/upload-artifact@v7
        with:
          name: firefox-devtools-mcp-package
          path: dist-package/
          retention-days: 7
