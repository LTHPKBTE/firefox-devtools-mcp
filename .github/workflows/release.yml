name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The tag names the release, package.json names the artifacts inside it,
      # so a mismatch would ship a bundle whose version differs from its URL.
      - name: Verify tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build all-tools bundle
        run: npm run build:moz

      - name: Test
        run: npm run test:run

      - name: Normalize output directory
        run: mv dist.moz dist

      - name: Create archive
        run: tar -czf firefox-devtools-mcp-${{ github.ref_name }}.tar.gz dist package.json README.md LICENSE-APACHE LICENSE-MIT

      - name: Build MCPB bundle
        run: npm run build:mcpb

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            firefox-devtools-mcp-${{ github.ref_name }}.tar.gz \
            dist-mcpb/*.mcpb \
            --generate-notes
